<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal SIRI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E14;
    --surface: #131822;
    --surface-2: #1B2230;
    --ink: #F1F5F9;
    --ink-soft: #8B96A8;
    --cyan: #4FD8FF;
    --purple: #B98CFF;
    --border: #232B3A;
    --danger: #FF6B81;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F4F6FA;
      --surface: #FFFFFF;
      --surface-2: #EDF0F6;
      --ink: #10141C;
      --ink-soft: #5B6474;
      --border: #DDE2EC;
    }
  }
  :root[data-theme="light"] {
    --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #EDF0F6;
    --ink: #10141C; --ink-soft: #5B6474; --border: #DDE2EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    padding: 28px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  .title {
    font-size: clamp(26px, 6vw, 34px);
    font-weight: 700;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin: 0; }

  .controls {
    display: flex; gap: 10px; justify-content: center; align-items: center;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  select, .toggle-chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    font-family: inherit; font-size: 13px; padding: 8px 12px; border-radius: 20px; cursor: pointer;
  }
  .toggle-chip.active { border-color: var(--cyan); color: var(--cyan); }

  .mic-zone { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .mic-btn {
    width: 92px; height: 92px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--border);
    color: var(--ink); font-size: 32px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; position: relative;
  }
  .mic-btn.listening {
    border-color: var(--cyan);
    box-shadow: 0 0 0 0 rgba(79,216,255,0.5);
    animation: pulse 1.4s infinite;
  }
  .mic-btn.thinking { border-color: var(--purple); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,216,255,0.45); }
    70% { box-shadow: 0 0 0 22px rgba(79,216,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,216,255,0); }
  }
  .mic-status { margin-top: 10px; font-size: 13px; color: var(--ink-soft); min-height: 18px; }

  .chat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; min-height: 200px; max-height: 420px; overflow-y: auto; margin-bottom: 14px;
  }
  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5;
    font-family: 'JetBrains Mono', monospace;
  }
  .msg.user .bubble { background: var(--cyan); color: #041018; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .empty-chat { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; }

  .text-row { display: flex; gap: 8px; }
  .text-row input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    font-family: inherit; font-size: 14px; padding: 11px 14px; border-radius: 24px;
  }
  .text-row button {
    background: var(--cyan); color: #041018; border: none; border-radius: 24px;
    padding: 0 18px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .unsupported {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 12.5px; color: var(--ink-soft); text-align: center; margin-bottom: 14px;
  }
  footer { text-align: center; color: var(--ink-soft); font-size: 11.5px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">Personal SIRI</h1>
    <p class="subtitle">Voice &amp; chat AI assistant — speak or type</p>
  </header>

  <div class="controls">
    <select id="voiceGender">
      <option value="female">Voice: Female</option>
      <option value="male">Voice: Male</option>
    </select>
    <button class="toggle-chip active" id="ttsToggle">🔊 Speech on</button>
  </div>

  <div class="mic-zone">
    <button class="mic-btn" id="micBtn">🎙️</button>
    <div class="mic-status" id="micStatus">Tap to speak</div>
  </div>

  <div id="unsupportedNote" class="unsupported" style="display:none;">
    Voice input isn't supported in this browser — use text input below instead.
  </div>

  <div class="chat" id="chat">
    <div class="empty-chat" id="emptyChat">Say something, or type a message below.</div>
  </div>

  <div class="text-row">
    <input type="text" id="textInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
  </div>

  <footer>Speech via your browser · Responses via Claude · Nothing is stored</footer>
</div>

<script>
(function() {
  var chatHistory = [
    { role: "system", content: "You are a helpful voice and chat assistant called Personal SIRI. Reply in just one or two short sentences, conversational tone." }
  ];
  var chatEl = document.getElementById("chat");
  var emptyChat = document.getElementById("emptyChat");
  var micBtn = document.getElementById("micBtn");
  var micStatus = document.getElementById("micStatus");
  var ttsToggle = document.getElementById("ttsToggle");
  var ttsEnabled = true;
  var sampleFn = null;

  claude.use("sample").then(function(s) { sampleFn = s; });

  ttsToggle.addEventListener("click", function() {
    ttsEnabled = !ttsEnabled;
    ttsToggle.textContent = ttsEnabled ? "🔊 Speech on" : "🔇 Speech off";
    ttsToggle.classList.toggle("active", ttsEnabled);
  });

  function addMessage(role, text) {
    emptyChat.style.display = "none";
    var row = document.createElement("div");
    row.className = "msg " + role;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function speak(text) {
    if (!ttsEnabled) return;
    try {
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      var voices = window.speechSynthesis.getVoices();
      var wantMale = document.getElementById("voiceGender").value === "male";
      var picked = null;
      for (var i = 0; i < voices.length; i++) {
        var n = voices[i].name.toLowerCase();
        if (wantMale && (n.indexOf("male") !== -1 || n.indexOf("david") !== -1 || n.indexOf("daniel") !== -1) && n.indexOf("female") === -1) { picked = voices[i]; break; }
        if (!wantMale && (n.indexOf("female") !== -1 || n.indexOf("zira") !== -1 || n.indexOf("samantha") !== -1)) { picked = voices[i]; break; }
      }
      if (picked) utter.voice = picked;
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* TTS not available, ignore */ }
  }

  async function handleUserMessage(text) {
    if (!text || !text.trim()) return;
    addMessage("user", text);
    chatHistory.push({ role: "user", content: text });

    micBtn.classList.remove("listening");
    micBtn.classList.add("thinking");
    micStatus.textContent = "Thinking...";

    try {
      if (!sampleFn) sampleFn = await claude.use("sample");
      if (!sampleFn) {
        addMessage("assistant", "AI isn't available in this preview.");
        micBtn.classList.remove("thinking");
        micStatus.textContent = "Tap to speak";
        return;
      }
      var result = await sampleFn(chatHistory, { modelTier: "quick" });
      var reply = (result && result.text) ? result.text.trim() : "Sorry, I couldn't generate a response.";
      chatHistory.push({ role: "assistant", content: reply });
      addMessage("assistant", reply);
      speak(reply);
    } catch (e) {
      addMessage("assistant", "Error getting a response: " + (e && e.message ? e.message : "unknown error"));
    }
    micBtn.classList.remove("thinking");
    micStatus.textContent = "Tap to speak";
  }

  // Speech recognition
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizing = false;
  var recognizer = null;

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    recognizer.onstart = function() {
      recognizing = true;
      micBtn.classList.add("listening");
      micStatus.textContent = "Listening...";
    };
    recognizer.onerror = function(e) {
      recognizing = false;
      micBtn.classList.remove("listening");
      micStatus.textContent = e.error === "not-allowed" ? "Microphone permission denied" : "Sorry, I didn't catch that";
    };
    recognizer.onend = function() {
      recognizing = false;
      micBtn.classList.remove("listening");
      if (micStatus.textContent === "Listening...") micStatus.textContent = "Tap to speak";
    };
    recognizer.onresult = function(event) {
      var text = event.results[0][0].transcript;
      handleUserMessage(text);
    };

    micBtn.addEventListener("click", function() {
      if (recognizing) { recognizer.stop(); return; }
      try { recognizer.start(); } catch (e) {}
    });
  } else {
    document.getElementById("unsupportedNote").style.display = "block";
    micBtn.disabled = true;
    micBtn.style.opacity = "0.4";
    micStatus.textContent = "Voice not supported here";
  }

  document.getElementById("sendBtn").addEventListener("click", function() {
    var input = document.getElementById("textInput");
    var text = input.value;
    input.value = "";
    handleUserMessage(text);
  });
  document.getElementById("textInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("sendBtn").click();
  });

  // warm up voice list (some browsers load async)
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function() {};
  }
})();
</script>
</body>
</html>
